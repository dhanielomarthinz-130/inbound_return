<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#166534" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge: Crisp rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <!-- Huruf D Warna Hijau -->
  <text x="32" y="37" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="40" fill="url(#dGrad)" dominant-baseline="middle" text-anchor="middle" filter="url(#softGlow)">D</text>
</svg>
